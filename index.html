<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hard Market: An Insurance Agency Sim</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="game-root">

  <!-- ============ TITLE SCREEN ============ -->
  <div class="screen active" id="screen-title">
    <div class="title-logo pixel-font">HARD MARKET</div>
    <div class="title-sub">AN INSURANCE AGENCY SIM</div>
    <div class="title-tagline">"Build the book. Fight for the client. Survive renewal."</div>
    <div class="title-menu">
      <button class="btn btn-primary" onclick="startNewGameFlow()">NEW GAME</button>
      <button class="btn" id="btn-continue" onclick="continueGame()" style="display:none;">CONTINUE</button>
      <button class="btn btn-small" id="btn-reset" onclick="confirmReset()" style="display:none;">RESET SAVE</button>
    </div>
  </div>

  <!-- ============ CHARACTER SELECT ============ -->
  <div class="screen select-screen" id="screen-character">
    <div class="select-header pixel-font">CHOOSE YOUR AGENT</div>
    <div class="select-subheader">Every agent has an edge. Pick yours.</div>
    <div class="card-grid" id="character-cards"></div>
    <button class="btn btn-primary" style="margin-top:16px;" id="btn-character-next" disabled onclick="goToCareerSelect()">NEXT</button>
  </div>

  <!-- ============ CAREER SELECT ============ -->
  <div class="screen select-screen" id="screen-career">
    <div class="select-header pixel-font">CHOOSE YOUR PATH</div>
    <div class="select-subheader">This shapes leads, appetite, and difficulty.</div>
    <div class="card-grid" id="career-cards"></div>
    <button class="btn btn-primary" style="margin-top:16px;" id="btn-career-next" disabled onclick="beginGame()">START AGENCY</button>
  </div>

  <!-- ============ MAIN OFFICE SCREEN (GBA dialogue-driven) ============ -->
  <div class="screen" id="screen-office">
    <div class="topbar">
      <span class="topbar-title pixel-font">HARD MARKET</span>
      <span class="topbar-date" id="topbar-date">Day 1 · Week 1 · Level 1</span>
    </div>

    <div class="office-scene" id="office-scene">
      <!-- static scene art + tap markers injected by JS -->
      <div class="npc-portrait-inset" id="npc-portrait-inset"></div>
    </div>

    <div class="stat-strip" id="stat-strip"></div>

    <div class="dialogue-dock">
      <div class="dialogue-frame">
        <div class="dialogue-titlebar">
          <span id="dlg-title" class="pixel-font">OFFICE</span>
          <button class="dialogue-back-btn" id="dlg-back-btn" onclick="dlgBack()" style="display:none;">◀ BACK</button>
        </div>
        <div class="dialogue-body" id="dlg-body"></div>
        <div class="dialogue-menu" id="dlg-menu"></div>
      </div>
    </div>
  </div>

  <!-- ============ LOADING ============ -->
  <div class="screen" id="screen-loading">
    <div class="title-sub">LOADING...</div>
  </div>

</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/events.js"></script>
<script src="js/art/portraits.js"></script>
<script src="js/art/office.js"></script>
<script src="js/engine.js"></script>
<script src="js/main.js"></script>
</body>
</html>
